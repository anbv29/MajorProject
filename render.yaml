services:
  - type: web
    name: cpss-project
    env: node
    plan: free
    rootDir: .
    healthCheckPath: /api/health
    buildCommand: npm install --prefix backend && npm install --prefix frontend && npm run build --prefix frontend
    startCommand: npm start --prefix backend
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: JWT_SECRET
        generateValue: true
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: cpss1
      - key: DB_PORT
        sync: false
      - key: DB_SSL
        value: "true"
